server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 跨域反代：把 ComfyUI 的 API/静态资源挂到前端同源。
    # 前端访问相对路径 `/comfy/...` 会落到这里，再转发到 8188。
    # 容器内 127.0.0.1 不会到达 host 网络的 comfyui，因此使用宿主机默认网关 172.17.0.1。
    # 关键: 透传 Host=127.0.0.1:8188 并强制 Origin=http://127.0.0.1:8188，让 ComfyUI
    # origin-only 中间件认为请求来自自身同源；同时前端浏览器看到的是同源 3000，无 CORS 拦截。
    # ComfyUI 任务依然由原生 comfyui 容器在国产卡上执行，此处只做协议桥接。
    location /comfy/ {
        proxy_pass http://172.17.0.1:8188/;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:8188";
        proxy_set_header Origin "http://127.0.0.1:8188";
        proxy_set_header Referer "http://127.0.0.1:8188/";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # 入口 HTML 不缓存，避免浏览器一直用旧 bundle（含重新生成张数等前端修复）。
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
